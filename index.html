<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Слівник</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0e6b64"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Слівник">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef2ef;--sf:#fff;--tx:#14262b;--mt:#5d7177;--ac:#0e6b64;--ac2:#f2a93b;--ok:#1f9d55;--bad:#d1453b;--ln:#d5ded9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a1c;--sf:#172629;--tx:#e8f0ee;--mt:#8fa5aa;--ac:#3fc4b8;--ln:#2a3f43}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 Onest,system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;font-weight:800;margin:4px 0 14px;letter-spacing:-.02em}h2{font-size:18px;margin:20px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat b{display:block;font-size:28px;font-weight:800}.stat span{color:var(--mt);font-size:14px}
button,.btn{font:inherit;border:0;border-radius:14px;padding:13px 18px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button.big{width:100%;padding:18px;font-size:19px;background:var(--ac2);color:#2a1a00}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
input,textarea,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
textarea{min-height:160px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--sf);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:140px;background:transparent;color:var(--mt);padding:10px 4px;font-size:14px}nav button.on{color:var(--ac);background:var(--bg)}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mt{color:var(--mt);font-size:14px}.chips button{padding:8px 12px;font-size:14px}
.flip{perspective:900px;margin:14px 0}.fc{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.f{transform:rotateY(180deg)}.fc>div{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:24px;font-weight:700;background:var(--sf);border:1px solid var(--ln);border-radius:22px}
.fc>div+div{transform:rotateY(180deg);color:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.opt.r{background:var(--ok);color:#fff}.opt.w{background:var(--bad);color:#fff}
.q{font-size:24px;font-weight:700;margin:18px 0}.fb{padding:10px 12px;border-radius:12px;margin:10px 0;font-weight:600}.fb.g{background:#1f9d5530}.fb.n{background:#d1453b30}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.item:last-child{border:0}
.tbl{max-height:260px;overflow:auto}.dup{opacity:.5;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
</style></head><body><div id="app"></div>
<nav id="nav"></nav>
<script>
const K='slovnyk.v1';
let S={cards:[],log:{},goal:30,dir:'mix',cs:false,typo:true,streakBest:0};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.cards.forEach(c=>{c.h=c.h||[];c.set=c.set||'Імпорт'});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Не вдалося зберегти. Зробіть резервну копію у «Ще».')}};
const $=s=>document.querySelector(s),DAY=864e5;
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let view='home',ses=null,imp=null;

/* ---- scheduling (спрощений FSRS: стабільність + складність) ---- */
const isNew=c=>!c.reps, isKnown=c=>c.reps&&c.st>=14, isHard=c=>c.fav||c.lapses>=2;
function review(c,g){ // g:1 не знаю, 2 важко, 3 добре, 4 легко
  const now=Date.now();(c.h=c.h||[]).push([now,g]);if(c.h.length>30)c.h.shift();
  c.reps=(c.reps||0)+1;
  if(g===1){c.lapses=(c.lapses||0)+1;c.df=Math.min(10,(c.df||5)+1);c.st=Math.max(.4,(c.st||1)*.4);c.due=now+5*60e3}
  else{
    c.df=Math.min(10,Math.max(1,(c.df||5)+(g===2?.5:g===4?-.7:-.3)));
    const f=1+(11-c.df)*(g===2?.12:g===4?.5:.3);
    c.st=c.reps===1?[0,0,1.2,3,7][g]:Math.max(c.st*f,[0,0,1.2,2,5][g]);
    c.due=now+c.st*DAY;
  }
  bump();save();
}
const dueList=()=>S.cards.filter(c=>c.reps&&c.due<=Date.now()).sort((a,b)=>a.due-b.due);
const todayNew=()=>S.cards.filter(c=>c.h&&c.h.length&&dk(new Date(c.h[0][0]))===dk()).length;
const metDay=d=>{const k=dk(d);return !!(S.met&&S.met[k])||(S.log[k]||0)>=S.goal};
function streak(){let n=0;const d=new Date();if(!metDay(d))d.setDate(d.getDate()-1);while(metDay(d)){n++;d.setDate(d.getDate()-1)}if(n>(S.streakBest||0))S.streakBest=n;return n}
function bump(){const k=dk();S.log[k]=(S.log[k]||0)+1;if(S.log[k]>=S.goal)(S.met=S.met||{})[k]=1;streak()}
const sum=days=>{let t=0;for(let i=0;i<days;i++)t+=S.log[dk(new Date(Date.now()-i*DAY))]||0;return t};

/* ---- tts, checking ---- */
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const norm=s=>{s=String(s).replace(/\(.*?\)/g,'').replace(/[.!?…"“”]+$/g,'').replace(/\s+/g,' ').trim();return S.cs?s:s.toLowerCase()};
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?0:j}
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function check(inp,ans,en){const x=norm(inp);if(!x)return 0;
  const alts=en?[ans]:[ans,...ans.split(/[;,/]|\s+—\s+/)];let best=9;
  for(const a of alts){const y=norm(a);if(!y)continue;best=Math.min(best,x===y?0:lev(x,y))}
  return best===0?2:(S.typo&&best<=(norm(ans).length>=10?2:1)&&norm(ans).length>=5?1:0)} // 2 точно, 1 майже, 0 ні
const Q=(c,en)=>en?c.en:c.uk, A=(c,en)=>en?c.uk:c.en;

/* ---- import ---- */
function parse(txt,set){
  const lines=txt.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const sep=['\t',';',' - ',' — ',','].find(s=>lines.filter(l=>l.includes(s)).length>=lines.length*.6)||'\t';
  const have=new Set(S.cards.map(c=>c.en.toLowerCase()+'|'+c.uk.toLowerCase())),seen=new Set(),rows=[];
  for(const l of lines){const p=l.split(sep).map(x=>x.trim());const en=p[0]||'',uk=p[1]||'';
    const key=en.toLowerCase()+'|'+uk.toLowerCase();
    rows.push({en,uk,ipa:p[2]||'',ex:p[3]||'',set,err:!en||!uk?'порожнє поле':'',dup:have.has(key)||seen.has(key)});seen.add(key)}
  return rows}
function doImport(){const ok=imp.rows.filter(r=>!r.err&&!r.dup);
  ok.forEach(r=>S.cards.push({id:uid(),en:r.en,uk:r.uk,ipa:r.ipa,ex:r.ex,set:r.set||'Імпорт',reps:0,lapses:0,fav:0,h:[],created:Date.now()}));
  save();alert(`Імпортовано: ${ok.length}\nДублікатів пропущено: ${imp.rows.filter(r=>r.dup).length}\nПомилок: ${imp.rows.filter(r=>r.err).length}`);imp=null;view='home';render()}

/* ---- session ---- */
function retry(){const ids=[...new Set(ses.wrong.map(c=>c.id))],m=ses.mode;ses={mode:m==='test'?'learn':m,q:shuf(ids),total:ids.length,done:0,wrong:[],right:0,step:0,fl:false,ans:null,seen:{}};render()}
let SL=[];
function vSets(){const g={};S.cards.forEach(c=>(g[c.set]=g[c.set]||[]).push(c));SL=Object.keys(g);
  return`<h1>Набори</h1><button style="width:100%;margin-bottom:12px" onclick="newSet()">+ Новий набір</button>`+(SL.map((s,i)=>{const a=g[s];return`<div class="card"><b>${esc(s)}</b><div class="mt">${a.length} слів · знаю ${a.filter(isKnown).length}</div><div class="grid" style="margin-top:10px"><button onclick="start('flash',{set:SL[${i}]})">Картки</button><button onclick="start('learn',{set:SL[${i}]})">Learn</button><button onclick="start('write',{set:SL[${i}]})">Write</button><button onclick="start('test',{set:SL[${i}]})">Test</button></div><div class="row chips" style="margin-top:10px"><button class="sec" onclick="setAct('open',${i})">Слова</button><button class="sec" onclick="setAct('ren',${i})">Назва</button><button class="sec" onclick="setAct('cp',${i})">Копія</button><button class="sec" onclick="setAct('ex',${i})">Експорт</button><button class="sec" onclick="setAct('del',${i})">Видалити</button></div></div>`}).join('')||'<p class="mt">Наборів ще немає.</p>')}
function setAct(a,i){const s=SL[i],l=S.cards.filter(c=>c.set===s);
  if(a==='open'){fs=s;ff='all';fq='';view='dict'}
  else if(a==='ren'){const n=prompt('Нова назва набору:',s);if(!n||!n.trim())return;l.forEach(c=>c.set=n.trim())}
  else if(a==='cp'){const n=prompt('Назва копії:',s+' (копія)');if(!n||!n.trim())return;l.forEach(c=>S.cards.push({...c,id:uid(),set:n.trim(),reps:0,lapses:0,fav:0,h:[],st:0,due:0}))}
  else if(a==='del'){if(!confirm(`Видалити набір «${s}» і ${l.length} слів?`))return;S.cards=S.cards.filter(c=>c.set!==s)}
  else if(a==='ex'){exp(l,s);return}
  save();render()}
function newSet(){const n=prompt('Назва нового набору:');if(!n||!n.trim())return;imp=null;view='imp';render();$('#sn').value=n.trim()}
function exp(l,name){const t=l.map(c=>[c.en,c.uk,c.ipa||'',c.ex||''].join('\t')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=name+'.txt';a.click()}
function pickNew(l,k){const g={};shuf(l).forEach(c=>(g[c.set]=g[c.set]||[]).push(c));const ks=shuf(Object.keys(g)),o=[];while(o.length<k&&ks.some(s=>g[s].length))for(const s of ks)if(g[s].length&&o.length<k)o.push(g[s].pop());return o}
function start(mode,opt={}){
  let ids;
  if(mode==='cloze')ids=shuf(S.cards.filter(c=>mk(c))).slice(0,20).map(c=>c.id);else if(opt.set)ids=shuf(S.cards.filter(c=>c.set===opt.set)).map(c=>c.id);else if(mode==='test')ids=shuf(S.cards).slice(0,opt.n||20).map(c=>c.id);
  else{let d=dueList(),n=S.cards.filter(isNew);
    if(opt.hard){d=d.filter(isHard);n=[]}else n=pickNew(n,Math.min(15,Math.max(0,S.goal-todayNew())));
    ids=shuf([...d.slice(0,25),...n]).map(c=>c.id)}
  if(!ids.length){alert('На сьогодні нічого немає: усе повторено або база порожня.');return}
  ses={mode,q:ids,total:ids.length,done:0,wrong:[],right:0,step:0,fl:false,ans:null,seen:{}};view='study';render()}
const cur=()=>S.cards.find(c=>c.id===ses.q[0]);
function grade(ok,g){const c=cur();ses.q.shift();
  const T=ses.mode==='test'||ses.mode==='cloze';ses.cs=ses.cs||{};
  if(ok){ses.right++;ses.seen[c.id]=1;
    if(T)ses.done++;
    else{const need=c.reps&&c.st>=7?1:3,n=(ses.cs[c.id]||0)+1;ses.cs[c.id]=n;
      if(n>=need){review(c,g||3);if(need===3){c.st=Math.max(c.st,7);c.due=Math.max(c.due,Date.now()+7*DAY);save()}ses.done++}
      else{(c.h=c.h||[]).push([Date.now(),g||3]);bump();c.reps=Math.max(1,c.reps||0);c.due=Date.now()+10*60e3;save();ses.q.splice(Math.min(3+n*4,ses.q.length),0,c.id)}}}
  else{ses.wrong.push(c);ses.seen[c.id]=0;ses.cs[c.id]=0;if(T)ses.done++;else{review(c,1);ses.q.splice(Math.min(3,ses.q.length),0,c.id)}}
  ses.fl=false;ses.ans=null;ses.r=null;ses.opts=null;ses.k=null;ses.en=undefined;ses.fen=undefined;render()}
function gl(ok){if(!ses||!ses.q.length)return;const t=Date.now();if(t-(ses.t||0)<300)return;ses.t=t;grade(ok)}
function pick(i){if(!ses||ses.ans!==null||!ses.opts)return;const c=cur(),en=ses.en,id=c.id;ses.ans=i;const ok=ses.opts[i]===A(c,en);render();setTimeout(()=>{if(ses&&ses.q[0]===id&&ses.ans===i)grade(ok)},ok?650:1400)}
function submit(){if(!ses||ses.ans!==null)return;const c=cur(),v=$('#ti').value,en=ses.en;const r=check(v,ses.mode==='cloze'?mk(c).a:A(c,en),!en);ses.ans=v;ses.r=r;render()}
function pickEn(){return S.dir==='mix'?(ses.alt=!ses.alt):S.dir==='en'}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;try{const r=new R();r.lang='en-US';r.maxAlternatives=1;r.onresult=e=>{$('#ti').value=e.results[0][0].transcript;submit()};r.onerror=e=>alert('Мікрофон недоступний ('+e.error+'). Введіть відповідь текстом.');r.start()}catch(e){alert('Розпізнавання мовлення не підтримується в цьому браузері.')}}
function nextTyped(){if(!ses||ses.ans===null)return;grade(ses.r>0,ses.r===2?3:ses.r===1?2:1)}

/* ---- views ---- */
function render(){
  $('#nav').innerHTML=[['home','Головна'],['sets','Набори'],['dict','Словник'],['imp','Імпорт'],['vp','Practice'],['more','Ще']].map(([v,t])=>`<button class="${view===v?'on':''}" onclick="view='${v}';ses=null;render()">${t}</button>`).join('');
  $('#nav').style.display=view==='study'?'none':'flex';
  $('#app').innerHTML=({home:vHome,sets:vSets,dict:vDict,imp:vImp,more:vMore,vp:vVP,study:vStudy})[view]();
  if(view==='study'&&$('#ti'))$('#ti').focus();window.scrollTo(0,0)}
function vHome(){const n=S.cards.length,kn=S.cards.filter(isKnown).length,du=dueList().length,tn=Math.max(0,S.goal-todayNew()),nw=S.cards.filter(isNew).length;
  const t=S.log[dk()]||0,pc=Math.min(100,t/S.goal*100);
  if(!n)return`<h1>Слівник</h1><div class="card"><p>База порожня. Імпортуйте слова з Quizlet: вставте експортований текст або завантажте файли.</p><button class="big" onclick="seed()">Додати мої слова (${SEED.reduce((a,s)=>a+s[1].split('\n').length,0)})</button><button class="sec" style="width:100%;margin-top:10px" onclick="view='imp';render()">Імпортувати з Quizlet</button></div>`;
  return`<h1>Слівник</h1><div class="card"><div class="row sp"><b>Сьогодні: ${t} з ${S.goal}</b><b style="color:var(--ac)">🔥 ${streak()} дн. підряд</b></div><div class="bar" style="margin:10px 0"><i style="width:${pc}%"></i></div><div class="mt">${metDay(new Date())?'Ціль на сьогодні виконано ✓':`До цілі ще ${Math.max(0,S.goal-t)}${streak()?', щоб серія не перервалась':''}`} · рекорд: ${S.streakBest||0} дн.</div>
  <button class="big" onclick="start('flash')">Почати навчання</button></div>
  <div class="grid"><div class="card stat"><b>${n}</b><span>Усього слів</span></div><div class="card stat"><b>${kn}</b><span>Знаю</span></div><div class="card stat"><b>${n-kn}</b><span>Ще вчити (нових: ${nw})</span></div><div class="card stat"><b>${du}</b><span>Повторити сьогодні</span></div></div>
  <h2>Режими</h2><div class="grid"><button class="sec" onclick="start('flash')">Картки</button><button class="sec" onclick="start('learn')">Learn</button><button class="sec" onclick="start('write')">Write</button><button class="sec" onclick="start('test')">Тест (20)</button><button class="sec" onclick="start('cloze')">Пропуск у реченні</button></div>
  <button class="sec" style="width:100%;margin-top:10px" onclick="start('flash',{hard:1})">Лише складні й обрані (${S.cards.filter(isHard).length})</button>
  <h2>Активність</h2><div class="card">${[['7 днів',7],['30 днів',30]].map(([l,d])=>`<div class="row sp"><span>За ${l}</span><b>${sum(d)} відповідей</b></div>`).join('')}<div class="mt" style="margin-top:6px">Нові слова на сьогодні: ${tn}</div></div>`}

function vStudy(){
  if(!ses.q.length)return vDone();
  const c=cur(),m=ses.mode,prog=`<div class="row sp"><button class="sec" onclick="view='home';ses=null;render()">Вийти</button><span class="mt">${ses.done} / ${ses.total}</span></div><div class="bar" style="margin:10px 0"><i style="width:${ses.done/ses.total*100}%"></i></div>`;
  if(m==='flash'){const en=ses.fen===undefined?(ses.fen=pickEn()):ses.fen;return prog+`<div class="flip"><div class="fc ${ses.fl?'f':''}" onclick="ses.fl=!ses.fl;if(ses.fl&&ses.fen)speak('${esc(c.en).replace(/'/g,"\\'")}');render()"><div>${esc(Q(c,en))}</div><div>${esc(A(c,en))}${c.ipa?`<br><small>${esc(c.ipa)}</small>`:''}${exH(c)}</div></div></div>
  <div class="row"><button class="sec" onclick="speak(cur().en)">Вимова</button><button class="sec" onclick="cur().fav=cur().fav?0:1;save();render()">${c.fav?'★ Обране':'☆ В обране'}</button></div>
  <div class="grid" style="margin-top:12px"><button class="bad" onclick="gl(0)">Не знаю</button><button class="ok" onclick="gl(1)">Знаю</button></div><p class="mt">Натисніть на картку, щоб побачити переклад.</p>`}
  const CL=m==='cloze',mm=CL?mk(c):null;
  const kind=m==='write'||CL?'w':m==='test'?(ses.k=ses.k||(Math.random()<.5?'m':'w')):(ses.seen[c.id]===undefined&&!c.reps?'m':'w');
  const en=m==='write'||CL?false:ses.en===undefined?(ses.en=m==='test'?Math.random()<.5:pickEn()):ses.en;
  ses.en=en;let body='';
  if(kind==='m'){if(!ses.opts){const o=shuf(S.cards.filter(x=>x.id!==c.id&&A(x,en)!==A(c,en))).slice(0,3).map(x=>A(x,en));ses.opts=shuf([...o,A(c,en)])}
    body=ses.opts.map((o,i)=>`<button class="opt ${ses.ans!==null&&o===A(c,en)?'r':ses.ans===i?'w':''}" ${ses.ans!==null?'disabled':''} onclick="pick(${i})">${esc(o)}</button>`).join('')}
  else{body=ses.ans===null?`<input id="ti" autocomplete="off" autocapitalize="off" placeholder="Ваша відповідь" onkeydown="if(event.key==='Enter')submit()">${!en?'<p class="mt">Щоб продиктувати відповідь, натисніть 🎤 на клавіатурі телефона.</p>':''}<button style="width:100%;margin-top:10px" onclick="submit()">Перевірити</button>`

function bk(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='slovnyk-'+dk()+'.json';a.click()}
async function rs(f){try{const d=JSON.parse(await f.text());if(!Array.isArray(d.cards))throw 0;if(confirm(`Замінити поточну базу? У файлі ${d.cards.length} слів.`)){S=Object.assign(S,d);save();render()}}catch(e){alert('Файл не схожий на резервну копію.')}}
/* ---- Vocabulary Practice: окремий модуль, SRS карток не змінюється; дані в S.vps та c.vp (є в резервних копіях) ---- */
S.vps=S.vps||{sent:0};
const VT={sent:'Власні речення',ctx:'Контекст',spk:'Вимова',conv:'Розмова'};
const VP={t:null,c:null,a:0,txt:'',rr:'',o:null,cv:null};
const vNote=(c,t)=>c.vp&&c.vp[t];
const vSpk=s=>`speak(${JSON.stringify(s).replace(/"/g,'&quot;')})`;
const vHas=(c,t)=>{const l=t.toLowerCase(),W=c.en.toLowerCase().split(/[\s\/,]+/).filter(w=>w.length>2);return(W.length?W:[c.en.toLowerCase()]).every(w=>l.includes(w.length>4?w.slice(0,w.length-2):w))};
function vW(t,not){const L=S.cards.filter(c=>(!not||!not.includes(c.id))&&(t!=='ctx'||(c.ex&&mk(c))));if(!L.length)return null;
  const w=L.map(c=>{const o=vNote(c,t);return o?Math.max(.3,5-o.a)+Math.min(2,(Date.now()-o.t)/DAY*.2):4.5});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<L.length;i++){r-=w[i];if(r<=0)return L[i]}return L[0]}
function vRate(c,t,g){c.vp=c.vp||{};const o=c.vp[t]||{n:0,a:g};o.a=o.n?o.a*.6+g*.4:g;o.n++;o.l=g;o.t=Date.now();c.vp[t]=o;save()}
function vGo(t,not){const c=vW(t,not);if(!c){alert(t==='ctx'?'Для цієї вправи потрібні слова з прикладами речень. Додайте приклад до слова (поле «Додати/змінити IPA та приклад») або імпортуйте приклади.':'У базі немає слів.');VP.t=null;render();return}
  Object.assign(VP,{t,c,a:0,txt:'',rr:'',o:null,cv:null});if(t==='ctx')vBuildCtx();if(t==='conv')vBuildConv();render()}
function vFin(g){const last=VP.c.id;if(VP.t==='conv'){VP.cv.used.forEach(id=>{const c=S.cards.find(x=>x.id===id);if(c)vRate(c,'conv',g)})}else vRate(VP.c,VP.t,g);vGo(VP.t,[last])}
function vEdit(){const c=VP.c;c.ipa=$('#vi').value.trim();c.ex=$('#ve').value.trim();c.exu=$('#vu').value.trim();save();if(VP.t==='ctx')vBuildCtx();render()}
function vWord(c,hide){return`<div class="card"><div class="q" style="margin:0">${esc(c.en)} <button class="sec" style="padding:6px 10px" onclick="${vSpk(c.en)}">♪</button></div><div class="mt" style="font-size:17px">${esc(c.uk)}${c.ipa?` · <b>${esc(c.ipa)}</b>`:''}</div>${hide?'':exH(c)}
<details style="margin-top:10px"><summary class="mt">Додати/змінити IPA та приклад</summary><input id="vi" placeholder="IPA, напр. /ˈstʌbərn/" value="${esc(c.ipa||'')}" style="margin-top:8px"><input id="ve" placeholder="Приклад речення (англ.)" value="${esc(c.ex||'')}" style="margin-top:8px"><input id="vu" placeholder="Переклад прикладу" value="${esc(c.exu||'')}" style="margin-top:8px"><button class="sec" style="width:100%;margin-top:8px" onclick="vEdit()">Зберегти</button></details></div>`}
const vRateUI=()=>`<div class="card"><b>Наскільки добре ви засвоїли це слово у цій вправі?</b><div class="grid" style="margin-top:10px">${[[1,'Складно'],[2,'Так собі'],[3,'Добре'],[4,'Легко']].map(([g,l])=>`<button class="sec" onclick="vFin(${g})">${l}</button>`).join('')}</div><div class="mt" style="margin-top:8px">Оцінка визначає, як часто слово повертатиметься в цій вправі. Інтервальні картки вона не змінює.</div></div>`;
function vMenu(){const C=S.cards,P=C.filter(c=>c.vp),hard=C.filter(c=>vNote(c,'spk')&&vNote(c,'spk').a<=2.5),need=C.filter(c=>c.vp&&Object.values(c.vp).some(o=>o.a<=2.5));
  const ls=a=>a.length?a.slice(0,15).map(c=>esc(c.en)).join(', ')+(a.length>15?'…':''):'—';
  return`<h1>Vocabulary Practice</h1><div class="mt">Вправи беруть слова з вашої бази. Прогрес окремий від карток і не позначає слово «вивченим».</div>
  <div class="grid" style="margin-top:12px">${[['sent','Create your own sentence'],['ctx','Choose the correct context'],['spk','Speaking practice'],['conv','Use it in conversation']].map(([t,l])=>`<button class="sec" onclick="vGo('${t}')">${l}</button>`).join('')}</div>
  <details class="card" style="margin-top:12px"><summary><b>AI (необов'язково)</b></summary><div class="mt" style="margin:8px 0">URL вашого Cloudflare Worker і пароль (див. README). Без цього AI-функції вимкнені.</div><input id="ai1" placeholder="https://....workers.dev" value="${esc(S.aiUrl||'')}"><input id="ai2" placeholder="Пароль" value="${esc(S.aiTok||'')}" style="margin-top:8px"><button class="sec" style="width:100%;margin-top:8px" onclick="S.aiUrl=$('#ai1').value.trim();S.aiTok=$('#ai2').value.trim();save();alert('Збережено')">Зберегти</button></details><h2>Статистика</h2><div class="grid"><div class="card stat"><b>${P.length}</b><span>Слів опрацьовано</span></div><div class="card stat"><b>${S.vps.sent}</b><span>Власних речень</span></div><div class="card stat"><b>${C.filter(c=>vNote(c,'conv')).length}</b><span>Слів у розмовах</span></div><div class="card stat"><b>${need.length}</b><span>Потребують повторення</span></div></div>
  <div class="card"><div class="mt">За типами вправ</div>${Object.keys(VT).map(t=>`<div class="row sp"><span>${VT[t]}</span><b>${C.filter(c=>vNote(c,t)).length} слів</b></div>`).join('')}<div class="mt" style="margin-top:10px">Складно вимовляти:</div>${ls(hard)}<div class="mt" style="margin-top:10px">Потребують повторення:</div>${ls(need)}</div>`}
function vVP(){if(!S.cards.length)return'<h1>Vocabulary Practice</h1><div class="card"><p>Спочатку додайте слова на вкладці «Головна» або «Імпорт».</p></div>';
  if(!VP.t)return vMenu();
  const T={sent:'Create your own sentence',ctx:'Choose the correct context',spk:'Speaking practice',conv:'Use it in conversation'}[VP.t];
  return`<h1>${T}</h1>`+({sent:vS1,ctx:vS2,spk:vS3,conv:vS4})[VP.t]()+`<button class="sec" style="width:100%;margin-top:10px" onclick="VP.t=null;try{speechSynthesis.cancel()}catch(e){}render()">← До Vocabulary Practice</button>`}
/* 1: власне речення (локально лише базові перевірки форми) */
function vS1(){const c=VP.c;return vWord(c,1)+`<div class="card"><b>Складіть власне речення зі словом «${esc(c.en)}»</b><textarea id="vs" style="min-height:90px;margin-top:8px" placeholder="Write your sentence in English…" ${VP.a?'readonly':''}>${esc(VP.txt)}</textarea><div class="row" style="margin-top:8px"><button class="sec" onclick="speak($('#vs').value)">🔊 Озвучити</button>${VP.a?'':'<button class="big" onclick="vCheck()">Перевірити</button>'}</div></div>`+(VP.a?VP.res+(S.aiUrl?vAIbox:'')+vRateUI():'')}
function vCheck(){const c=VP.c,t=$('#vs').value.trim();if(!t){alert('Введіть речення.');return}
  const ck=[[vHas(c,t),`Містить «${c.en}»`],[t.split(/\s+/).length>=4,'Щонайменше 4 слова'],[/^[A-Z"“]/.test(t),'Починається з великої літери'],[/[.!?]["”]?$/.test(t),'Закінчується розділовим знаком'],[!/(^|[^A-Za-z'])i([^A-Za-z']|$)/.test(t),'Займенник I — з великої літери']];
  S.vps.sent++;save();VP.a=1;VP.txt=t;
  VP.res=`<div class="card"><b>Базова перевірка форми</b>${ck.map(([ok,l])=>`<div class="fb ${ok?'g':'n'}" style="font-weight:500;margin:6px 0">${ok?'✓':'✗'} ${esc(l)}</div>`).join('')}${c.ex?`<div class="mt" style="margin-top:8px">Приклад для порівняння:</div>${exH(c)}`:''}<div class="mt" style="margin-top:10px">Граматичне виправлення, пояснення помилок і «природніший варіант» потребують AI. Тут AI не підключено, і я його не імітую: порівняйте своє речення з прикладом вище.</div></div>`;render()}
/* 2: правильний контекст */
function vBuildCtx(){const c=VP.c,D=shuf(S.cards.filter(x=>x.id!==c.id&&x.ex&&mk(x))).slice(0,3).map(x=>mk(x).q.replace('____',c.en));VP.a=0;VP.o=D.length>=2?shuf([{s:c.ex,ok:1},...D.map(s=>({s}))]):null}
function vOpt(i){VP.o[i].p=1;VP.right=!!VP.o[i].ok;VP.a=1;render()}
function vS2(){const c=VP.c,o=VP.o;let h=vWord(c,1);if(!o)return h+'<div class="card">Замало інших слів із прикладами для створення варіантів. Додайте приклади до слів.</div>';
  h+=`<div class="card"><b>У якому реченні «${esc(c.en)}» вжито правильно?</b><div style="margin-top:10px">${o.map((x,i)=>`<button class="opt ${VP.a?(x.ok?'r':(x.p?'w':'')):''}" ${VP.a?'disabled':''} onclick="vOpt(${i})">${esc(x.s)}</button>`).join('')}</div></div>`;
  if(VP.a)h+=`<div class="card"><div class="fb ${VP.right?'g':'n'}">${VP.right?'Правильно!':'Не зовсім.'}</div><p><b>${esc(c.en)}</b> — ${esc(c.uk)}</p>${exH(c)}<p class="mt">Неправильні варіанти автоматично зібрані з прикладів інших слів, у які підставлено «${esc(c.en)}»: вони навмисно звучать неприродно або змінюють значення.</p></div>`+vRateUI();return h}
/* 3: говоріння (Speech Recognition, не фонетичний аналіз) */
function vS3(){const c=VP.c;return vWord(c,1)+`<div class="card"><b>Вимовте вголос: «${esc(c.en)}»</b><div class="row" style="margin-top:10px"><button class="sec" onclick="${vSpk(c.en)}">🔊 Еталон</button><button class="big" onclick="vRec()">🎤 Запис</button></div><div id="vr" class="mt" style="margin-top:10px">${VP.rr}</div><div class="mt" style="margin-top:12px">Якщо «Запис» не працює: продиктуйте фразу через 🎤 на клавіатурі телефону в це поле.</div><input id="vd" placeholder="Що ви сказали…" style="margin-top:6px" autocapitalize="off"><button class="sec" style="width:100%;margin-top:8px" onclick="vDict()">Порівняти</button><button class="sec" style="width:100%;margin-top:10px" onclick="VP.a=1;render()">Вимовив(ла) без запису</button></div>`+(VP.a?vRateUI():'')}
function vRec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition,o=$('#vr');
  if(!R){o.textContent='Цей браузер не підтримує розпізнавання мовлення (спробуйте Chrome або Safari). Скористайтеся кнопкою «Вимовив(ла) без запису».';return}
  let r;try{r=new R()}catch(e){o.textContent='Не вдалося запустити розпізнавання.';return}
  r.lang='en-US';r.maxAlternatives=3;o.textContent='Слухаю… говоріть';
  r.onresult=e=>{const al=[...e.results[0]].map(x=>x.transcript),N=s=>s.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean),T=N(VP.c.en);let best=-1,H=[];al.forEach(a=>{const h=N(a),m=T.filter(w=>h.includes(w)).length;if(m>best){best=m;H=h}});
    VP.rr=`Розпізнано: <b>${esc(al[0])}</b><br>Оригінал: ${T.map(w=>`<span style="color:var(--${H.includes(w)?'ok':'bad'});font-weight:700">${esc(w)}</span>`).join(' ')}<br>Збіг слів: ${Math.round(best/T.length*100)}%<div style="margin-top:6px">Це розпізнавання мовлення, а не фонетичний аналіз: воно показує, чи система зрозуміла слова, але не оцінює окремі звуки. Можна повторити спробу.</div>`;VP.a=1;render()};
  r.onerror=e=>{o.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'Мікрофон недоступний: застосунок Claude не дає вбудованим сторінкам доступ до нього. Скористайтесь полем нижче: натисніть 🎤 на клавіатурі iPhone, продиктуйте фразу й натисніть «Порівняти». Або відкрийте сторінку в Safari.':'Помилка розпізнавання ('+e.error+'). Спробуйте ще раз.'};
  r.onend=()=>{if(o&&o.textContent.startsWith('Слухаю'))o.textContent='Нічого не розпізнано. Спробуйте ще раз.'};
  try{r.start()}catch(e){}}
function vDict(){const t=$('#vd').value.trim();if(!t){alert('Спочатку продиктуйте або введіть фразу.');return}const N=s=>s.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean),T=N(VP.c.en),H=N(t),m=T.filter(w=>H.includes(w)).length;
  VP.rr=`Ви сказали: <b>${esc(t)}</b><br>Оригінал: ${T.map(w=>`<span style="color:var(--${H.includes(w)?'ok':'bad'});font-weight:700">${esc(w)}</span>`).join(' ')}<br>Збіг слів: ${Math.round(m/T.length*100)}%<div style="margin-top:6px">Це порівняння тексту диктування, а не фонетичний аналіз вимови.</div>`;VP.a=1;render()}
/* 4: розмова (сценарій на ваших словах; це не AI) */
const VQ=[w=>`Do you know anyone or anything that is “${w}”? Tell me about it.`,w=>`When was the last time you needed to use “${w}”? What happened?`,w=>`How would you explain “${w}” to a friend? Use it in your answer.`,w=>`Can you describe a situation from your life where “${w}” fits?`];
function vBuildConv(){const a=[VP.c];for(let k=0;k<2;k++){const x=vW('conv',a.map(y=>y.id));if(x)a.push(x)}VP.cv={w:a,i:0,log:[],used:[],hint:0,qs:shuf(VQ).slice(0,a.length)}}
function vHint(){VP.cv.hint=1;render()}
function vSay(){const v=VP.cv,w=v.w[v.i],t=$('#vs').value.trim();if(!t){alert('Введіть відповідь.');return}
  const ok=vHas(w,t);v.log.push({t:v.aiq||v.qs[v.i](w.en)},{me:1,t,ok,f:ok?'Слово вжито ✓':`Слово «${w.en}» не вжито, але розмова триває`});if(ok&&!v.used.includes(w.id))v.used.push(w.id);v.i++;v.hint=0;v.aiq=null;if(S.aiUrl&&v.i<v.w.length)vAIq();else render()}
function vS4(){const v=VP.cv,w=v.w[v.i];let h='<div class="mt">Перше запитання сценарне; далі відповідає AI, якщо його підключено в меню Practice, інакше тривають сценарні запитання. Без AI співрозмовник він не оцінює зміст відповіді, а лише перевіряє, чи ви вжили слово.</div>';
  v.log.forEach(m=>h+=`<div class="card" style="${m.me?'margin-left:24px':'margin-right:24px'}"><div class="mt">${m.me?'Ви':'Співрозмовник'}</div>${esc(m.t)}${m.f?`<div class="fb ${m.ok?'g':'n'}" style="font-weight:500">${esc(m.f)}</div>`:''}</div>`);
  if(v.i>=v.w.length)return h+vRateUI();const q=v.pend?'Співрозмовник думає…':(v.aiq||v.qs[v.i](w.en));
  return h+`<div class="card"><div class="mt">Співрозмовник · ${esc(w.uk)}</div><div class="q" style="font-size:19px;margin:6px 0">${esc(q)} <button class="sec" style="padding:6px 10px" onclick="${vSpk(q)}">♪</button></div><textarea id="vs" style="min-height:80px" placeholder="Answer in English…"></textarea><div class="row" style="margin-top:8px"><button class="sec" onclick="vHint()">Підказка</button><button class="big" onclick="vSay()">Відповісти</button></div>${v.hint?`<div class="fb g" style="font-weight:500">${esc(w.en)} — ${esc(w.uk)}${w.ex?'<br>Приклад: '+esc(w.ex):''}<br>Почніть так: “I think…”, “Once, I…”, “My friend is…”</div>`:''}</div>`}

/* ---- AI через ваш Cloudflare Worker (необов'язково) ---- */
async function vAI(system,messages){if(!S.aiUrl)throw new Error('AI не підключено');const r=await fetch(S.aiUrl,{method:'POST',headers:{'Content-Type':'application/json','x-app-token':S.aiTok||''},body:JSON.stringify({system,messages})});if(!r.ok)throw new Error('помилка '+r.status);return(await r.json()).text}
const vAIbox='<div class="card"><button class="big" style="width:100%" onclick="vAICheck()">Перевірити з AI</button><div id="vai" style="margin-top:10px"></div></div>';
async function vAICheck(){const c=VP.c,o=$('#vai');o.textContent='Перевіряю…';
  try{const x=await vAI('You are an English tutor for a Ukrainian learner. Reply ONLY with JSON, no markdown: {"correct":"grammatically correct version of the sentence","error":"short explanation of mistakes in Ukrainian, empty if none","natural":"a more natural way to say it","uk":"Ukrainian translation of the correct version"}',[{role:'user',content:'Target word: '+c.en+'\nSentence: '+VP.txt}]);
    const j=JSON.parse(x.replace(/```json|```/g,'').trim());
    o.innerHTML=`<div class="fb g" style="font-weight:500">Правильно: <b>${esc(j.correct)}</b> <button class="sec" style="padding:6px 10px" onclick="${vSpk(j.correct)}">♪</button></div>${j.error?`<p>${esc(j.error)}</p>`:'<p>Помилок немає ✓</p>'}<p>Природніше: <b>${esc(j.natural)}</b> <button class="sec" style="padding:6px 10px" onclick="${vSpk(j.natural)}">♪</button></p><p class="mt">${esc(j.uk)}</p>`}
  catch(e){o.textContent='Не вдалося: '+e.message}}
function vAIq(){const v=VP.cv,w=v.w[v.i];v.pend=1;render();
  const m=[{role:'user',content:'Start the conversation.'},...v.log.map(x=>({role:x.me?'user':'assistant',content:x.t})),{role:'user',content:'[Next target word: '+w.en+'. React briefly to my last answer, then ask ONE short question that makes me use this word.]'}];
  vAI('You are a friendly English conversation partner for a Ukrainian learner (level B1). Briefly react to the learner\'s last answer in English (one sentence). If it has a mistake, add a short correction in Ukrainian in brackets. Then ask ONE short question. Max 45 words.',m).then(t=>{v.aiq=t}).catch(e=>{v.aiq=null}).finally(()=>{v.pend=0;render()})}
fillEx();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
